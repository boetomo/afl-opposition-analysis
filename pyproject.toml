[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "afl-opposition-analysis"
version = "0.1.0"
description = "AFL possession threat analysis and opposition reports"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas==3.0.6",
    "pyarrow==26.0.0",
]

[project.optional-dependencies]
notebook = ["notebook==7.6.3"]
model = ["scikit-learn==1.9.1", "xgboost==3.4.1"]
sequence = ["torch==2.11.0"]
tuning = ["optuna==5.0.0"]
app = ["streamlit==1.66.1", "plotly==7.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["afl_opposition*"]
